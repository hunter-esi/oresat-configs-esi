objects:
  - index: 0x4000
    name: sdr_power
    data_type: uint8

  - index: 0x4001
    name: sdr_status
    data_type: uint8
    # value_descriptions:
    #   'off': 0
    #   boot: 1
    #   standby: 2
    #   error: 0xff

  - index: 0x4002
    name: tx_data
    data_type: octet_str
    description: data to be transmitted. Preferred packets of 1099 bytes, greater will be chunked and framed  # yamllint disable-line rule:line-length
    access_type: rw

  - index: 0x4003
    name: tx_settings
    object_type: record
    description: tx settings defining the transmit path parameters
    subindexes:
      - subindex: 0x1
        name: idle_enabled
        data_type: bool
        description: idle_enabled
        access_type: rw
        default: true
      - subindex: 0x2
        name: frequency_mhz
        data_type: float32  # called real32 in the spec.
        description: frequency_mhz
        access_type: rw
        default: 2245.0
      - subindex: 0x3
        name: samples_per_symbol
        data_type: uint8
        description: samples_per_symbol
        access_type: rw
        default: 8
      - subindex: 0x4
        name: sampling_rate
        data_type: uint32
        description: sampling_rate
        access_type: rw
        default: 525000
      - subindex: 0x5
        name: scale_multiplier
        data_type: float32  # called real32 in the spec.
        description: scale_multiplier
        access_type: rw
        default: 1.0
      - subindex: 0x6
        name: nrz_encoding
        data_type: uint8
        description: nrz_encoding
        access_type: rw
        default: 1
      - subindex: 0x7
        name: rs_enabled
